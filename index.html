<!DOCTYPE html>
<html lang="en">    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Convention</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

header{
  background:linear-gradient(135deg,#7b1fa2,#e91e63);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-title{
  font-size:25px;
  font-weight:bold;
}

.header-sub{
  font-size:13px;
  opacity:.9;
  margin-top:4px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.logo{
  width:70px;
  height:70px;
  border-radius:50%;
  background:white;
  color:#e91e63;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  margin:10px auto 20px;
  box-shadow:0 5px 20px #bbb;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  box-shadow:0 3px 12px #ddd;
}

.stat-title{
  color:#777;
  font-size:13px;
}

.stat-value{
  font-size:24px;
  font-weight:bold;
  margin-top:8px;
}

.dashboard-title{
  margin:25px 0 12px;
  font-size:21px;
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.calendar-head button{
  border:0;
  background:#e91e63;
  color:white;
  padding:8px 14px;
  border-radius:8px;
  font-size:18px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day-name{
  text-align:center;
  font-weight:bold;
  color:#777;
  padding:8px 2px;
  font-size:12px;
}

.day{
  min-height:48px;
  background:#fafafa;
  border-radius:8px;
  padding:7px;
  text-align:center;
  cursor:pointer;
  border:1px solid #eee;
}

.day:hover{
  background:#fce4ec;
}

.booked{
  background:#e91e63;
  color:white;
  font-weight:bold;
}

.today{
  border:2px solid #7b1fa2;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#e91e63,#7b1fa2);
  color:white;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin:15px 0;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  font-size:13px;
  color:#555;
  display:block;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:80px;
}

.booking{
  margin-bottom:12px;
}

.booking-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.booking-name{
  font-weight:bold;
  font-size:18px;
}

.badge{
  background:#e8f5e9;
  color:#2e7d32;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  border:0;
  padding:8px 12px;
  border-radius:7px;
}

.edit{
  background:#fff3e0;
}

.delete{
  background:#ffebee;
  color:#c62828;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  box-shadow:0 -3px 15px #ddd;
  z-index:20;
}

nav button{
  border:0;
  background:white;
  color:#777;
  font-size:11px;
}

nav button.active{
  color:#e91e63;
  font-weight:bold;
}

nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:13px;
}

th{
  background:#f7f7f7;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:40px auto;
  border-radius:18px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .day{
    min-height:42px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-title">M Convention</div>
  <div class="header-sub">Convention Hall Management</div>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="section active">

<div class="logo">M</div>

<div class="stats">

<div class="card">
<div class="stat-title">Today Bookings</div>
<div class="stat-value" id="todayCount">0</div>
</div>

<div class="card">
<div class="stat-title">This Month</div>
<div class="stat-value" id="monthCount">0</div>
</div>

<div class="card">
<div class="stat-title">Received</div>
<div class="stat-value" id="received">₹0</div>
</div>

<div class="card">
<div class="stat-title">Pending</div>
<div class="stat-value" id="pending">₹0</div>
</div>

</div>

<button class="primary" onclick="openBooking()">＋ ADD NEW BOOKING</button>

<div class="card">
<div class="calendar-head">
<button onclick="changeMonth(-1)">‹</button>
<h3 id="monthTitle"></h3>
<button onclick="changeMonth(1)">›</button>
</div>

<div class="calendar" id="calendar"></div>
</div>

<h2 class="dashboard-title">Upcoming Events</h2>
<div id="upcoming"></div>

</section>


<!-- BOOKINGS -->
<section id="bookings" class="section">

<h2>Bookings</h2>

<button class="primary" onclick="openBooking()">＋ New Booking</button>

<div id="bookingList"></div>

</section>


<!-- CUSTOMERS -->
<section id="customers" class="section">

<h2>Customers</h2>

<div class="card" style="margin-top:15px">
<input id="customerSearch"
placeholder="Search customer or phone..."
oninput="showCustomers()">
</div>

<div id="customerList" style="margin-top:15px"></div>

</section>


<!-- EXPENSES -->
<section id="expenses" class="section">

<h2>Expenses</h2>

<button class="primary" onclick="addExpense()">＋ Add Expense</button>

<div class="card">
<h3>Total Expenses</h3>
<div class="stat-value" id="expenseTotal">₹0</div>
</div>

<div id="expenseList" style="margin-top:15px"></div>

</section>


<!-- REPORTS -->
<section id="reports" class="section">

<h2>Reports</h2>

<div class="stats" style="margin-top:15px">

<div class="card">
<div class="stat-title">Bookings</div>
<div class="stat-value" id="reportBookings">0</div>
</div>

<div class="card">
<div class="stat-title">Income</div>
<div class="stat-value" id="reportIncome">₹0</div>
</div>

<div class="card">
<div class="stat-title">Expenses</div>
<div class="stat-value" id="reportExpenses">₹0</div>
</div>

<div class="card">
<div class="stat-title">Balance</div>
<div class="stat-value" id="reportBalance">₹0</div>
</div>

</div>

<div class="card" style="margin-top:15px">
<h3>Booking Report</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Customer</th>
<th>Event</th>
<th>Total</th>
<th>Paid</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="reportTable"></tbody>
</table>
</div>

</div>

</section>

</div>


<!-- BOTTOM NAV -->

<nav>

<button class="active" onclick="showSection('home',this)">
<span>🏠</span>Home
</button>

<button onclick="showSection('bookings',this)">
<span>📅</span>Bookings
</button>

<button onclick="showSection('customers',this)">
<span>👥</span>Customers
</button>

<button onclick="showSection('expenses',this)">
<span>💰</span>Expenses
</button>

<button onclick="showSection('reports',this)">
<span>📊</span>Reports
</button>

</nav>


<!-- BOOKING MODAL -->

<div class="modal" id="bookingModal">

<div class="modal-box">

<button class="close" onclick="closeBooking()">×</button>

<h2 id="modalTitle">New Booking</h2>

<br>

<div class="form-grid">

<div>
<label>Customer Name</label>
<input id="name" placeholder="Customer name">
</div>

<div>
<label>Phone Number</label>
<input id="phone" type="tel" placeholder="Phone number">
</div>

<div>
<label>Event Type</label>
<select id="event">
<option>Marriage</option>
<option>Reception</option>
<option>Birthday</option>
<option>Meeting</option>
<option>Engagement</option>
<option>Other</option>
</select>
</div>

<div>
<label>Event Date</label>
<input id="date" type="date">
</div>

<div>
<label>Event Time</label>
<select id="time">
<option>Afternoon</option>
<option>Night</option>
</select>
</div>

<div>
<label>Number of Guests</label>
<input id="guests" type="number" placeholder="Guests">
</div>

<div>
<label>Total Amount ₹</label>
<input id="total" type="number" placeholder="Total amount">
</div>

<div>
<label>Advance Paid ₹</label>
<input id="advance" type="number" placeholder="Advance">
</div>

</div>

<br>

<label>Notes</label>
<textarea id="notes" placeholder="Additional notes"></textarea>

<button class="primary" onclick="saveBooking()">SAVE BOOKING</button>

</div>
</div>


<script>

let bookings =
JSON.parse(localStorage.getItem("mConventionBookings") || "[]");

let expenses =
JSON.parse(localStorage.getItem("mConventionExpenses") || "[]");

let editId = null;

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();


function money(value){
return "₹" + Number(value || 0).toLocaleString("en-IN");
}


function saveData(){
localStorage.setItem(
"mConventionBookings",
JSON.stringify(bookings)
);

localStorage.setItem(
"mConventionExpenses",
JSON.stringify(expenses)
);
}


function showSection(id,button){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

updateAll();
}


function openBooking(id=null){

editId=id;

document.getElementById("bookingModal")
.style.display="block";

if(id){

let b=bookings.find(x=>x.id===id);

document.getElementById("modalTitle")
.innerText="Edit Booking";

name.value=b.name;
phone.value=b.phone;
event.value=b.event;
date.value=b.date;
time.value=b.time;
guests.value=b.guests;
total.value=b.total;
advance.value=b.advance;
notes.value=b.notes || "";

}else{

document.getElementById("modalTitle")
.innerText="New Booking";

document.querySelectorAll("#bookingModal input, #bookingModal textarea")
.forEach(x=>x.value="");

date.value=new Date()
.toISOString().split("T")[0];

advance.value=0;
}

}


function closeBooking(){

document.getElementById("bookingModal")
.style.display="none";

editId=null;
}


function saveBooking(){

let booking={

id:editId || Date.now(),

name:name.value.trim(),

phone:phone.value.trim(),

event:event.value,

date:date.value,

time:time.value,

guests:guests.value,

total:Number(total.value || 0),

advance:Number(advance.value || 0),

notes:notes.value.trim()

};


if(!booking.name || !booking.date){

alert("Please enter customer name and event date.");

return;

}


/* Prevent same date + same time slot */

let duplicate=bookings.find(x=>
x.id!==booking.id &&
x.date===booking.date &&
x.time===booking.time
);

if(duplicate){

alert(
"This time slot is already booked on this date."
);

return;

}


if(editId){

let index=bookings.findIndex(x=>x.id===editId);

bookings[index]=booking;

}else{

bookings.push(booking);

}

saveData();

closeBooking();

updateAll();

alert("Booking saved successfully.");

}


function deleteBooking(id){

if(confirm("Delete this booking?")){

bookings=bookings.filter(x=>x.id!==id);

saveData();

updateAll();

}

}


function bookingHTML(b){

let balance=Math.max(0,b.total-b.advance);

return `
<div class="card booking">

<div class="booking-top">

<div>
<div class="booking-name">${escapeHTML(b.name)}</div>
<div class="small">📞 ${escapeHTML(b.phone)}</div>
</div>

<div class="badge">${escapeHTML(b.event)}</div>

</div>

<div class="small">
📅 ${formatDate(b.date)}
&nbsp; • &nbsp;
🕐 ${escapeHTML(b.time)}
</div>

<div class="small">
👥 Guests: ${b.guests || 0}
</div>

<div style="margin-top:10px">
<strong>Total:</strong> ${money(b.total)}
&nbsp;&nbsp;
<strong>Paid:</strong> ${money(b.advance)}
&nbsp;&nbsp;
<strong>Balance:</strong> ${money(balance)}
</div>

${b.notes ? `<div class="small">📝 ${escapeHTML(b.notes)}</div>` : ""}

<div class="actions">

<button class="edit"
onclick="openBooking(${b.id})">
✏️ Edit
</button>

<button class="delete"
onclick="deleteBooking(${b.id})">
🗑 Delete
</button>

</div>

</div>
`;

}


function showBookings(){

let list=document.getElementById("bookingList");

let sorted=[...bookings]
.sort((a,b)=>a.date.localeCompare(b.date));

if(!sorted.length){

list.innerHTML='<div class="card empty">No bookings yet.</div>';

return;
}

list.innerHTML=sorted.map(bookingHTML).join("");

}


function showCustomers(){

let search=
(document.getElementById("customerSearch")?.value || "")
.toLowerCase();

let customers={};

bookings.forEach(b=>{

if(!customers[b.phone]){

customers[b.phone]={
name:b.name,
phone:b.phone,
events:0,
amount:0
};

}

customers[b.phone].events++;
customers[b.phone].amount+=b.total;

});


let arr=Object.values(customers)
.filter(c=>
c.name.toLowerCase().includes(search) ||
c.phone.toLowerCase().includes(search)
);


let box=document.getElementById("customerList");

if(!arr.length){

box.innerHTML='<div class="card empty">No customers found.</div>';

return;
}


box.innerHTML=arr.map(c=>`

<div class="card" style="margin-bottom:12px">

<h3>${escapeHTML(c.name)}</h3>

<div class="small">📞 ${escapeHTML(c.phone)}</div>

<div class="small">
Events: ${c.events}
</div>

<div style="margin-top:8px">
Total business: <strong>${money(c.amount)}</strong>
</div>

</div>

`).join("");

}


function addExpense(){

let purpose=prompt("Expense purpose:");

if(!purpose)return;

let amount=Number(
prompt("Amount ₹:") || 0
);

if(!amount)return;

expenses.push({

id:Date.now(),

purpose:purpose,

amount:amount,

date:new Date()
.toISOString()
.split("T")[0]

});

saveData();

updateAll();

}


function showExpenses(){

let box=document.getElementById("expenseList");

if(!expenses.length){

box.innerHTML=
'<div class="card empty">No expenses added.</div>';

return;
}

box.innerHTML=
expenses.map(e=>`

<div class="card" style="margin-bottom:10px">

<strong>${escapeHTML(e.purpose)}</strong>

<div class="small">
${formatDate(e.date)}
</div>

<div style="margin-top:8px;font-size:18px">
${money(e.amount)}
</div>

</div>

`).join("");

}


function renderCalendar(){

let cal=document.getElementById("calendar");

let first=new Date(
currentYear,
currentMonth,
1
);

let last=new Date(
currentYear,
currentMonth+1,
0
);

document.getElementById("monthTitle")
.innerText=first.toLocaleDateString(
"en-IN",
{
month:"long",
year:"numeric"
}
);

cal.innerHTML="";

[
"Sun","Mon","Tue","Wed",
"Thu","Fri","Sat"
].forEach(d=>{

let x=document.createElement("div");

x.className="day-name";

x.innerText=d;

cal.appendChild(x);

});


for(let i=0;i<first.getDay();i++){

cal.appendChild(document.createElement("div"));

}


for(let day=1;day<=last.getDate();day++){

let d=new Date(
currentYear,
currentMonth,
day
);

let date=d.toISOString().split("T")[0];

let div=document.createElement("div");

div.className="day";

if(bookings.some(x=>x.date===date)){

div.classList.add("booked");

}

let now=new Date();

if(
day===now.getDate() &&
currentMonth===now.getMonth() &&
currentYear===now.getFullYear()
){

div.classList.add("today");

}

div.innerText=day;

div.onclick=()=>{

document.getElementById("date").value=date;

openBooking();

};

cal.appendChild(div);

}

}


function changeMonth(amount){

currentMonth+=amount;

if(currentMonth<0){

currentMonth=11;

currentYear--;

}

if(currentMonth>11){

currentMonth=0;

currentYear++;

}

renderCalendar();

}


function showUpcoming(){

let today=
new Date().toISOString().split("T")[0];

let upcoming=bookings
.filter(x=>x.date>=today)
.sort((a,b)=>a.date.localeCompare(b.date))
.slice(0,5);

let box=document.getElementById("upcoming");

if(!upcoming.length){

box.innerHTML=
'<div class="card empty">No upcoming events.</div>';

return;
}

box.innerHTML=
upcoming.map(bookingHTML).join("");

}


function updateDashboard(){

let today=
new Date().toISOString().split("T")[0];

let month=
new Date().toISOString().slice(0,7);

let todayCount=
bookings.filter(x=>x.date===today).length;

let monthBookings=
bookings.filter(x=>x.date.startsWith(month));

let received=
bookings.reduce(
(sum,x)=>sum+Number(x.advance||0),0
);

let pending=
bookings.reduce(
(sum,x)=>sum+Math.max(
0,
Number(x.total||0)-Number(x.advance||0)
),0
);

document.getElementById("todayCount")
.innerText=todayCount;

document.getElementById("monthCount")
.innerText=monthBookings.length;

document.getElementById("received")
.innerText=money(received);

document.getElementById("pending")
.innerText=money(pending);

}


function showReports(){

let income=
bookings.reduce(
(s,b)=>s+Number(b.advance||0),0
);

let expense=
expenses.reduce(
(s,e)=>s+Number(e.amount||0),0
);

document.getElementById("reportBookings")
.innerText=bookings.length;

document.getElementById("reportIncome")
.innerText=money(income);

document.getElementById("reportExpenses")
.innerText=money(expense);

document.getElementById("reportBalance")
.innerText=money(income-expense);

document.getElementById("expenseTotal")
.innerText=money(expense);

let table=document.getElementById("reportTable");

table.innerHTML=bookings.map(b=>`

<tr>

<td>${formatDate(b.date)}</td>

<td>${escapeHTML(b.name)}</td>

<td>${escapeHTML(b.event)}</td>

<td>${money(b.total)}</td>

<td>${money(b.advance)}</td>

<td>${money(Math.max(0,b.total-b.advance))}</td>

</tr>

`).join("");

}


function updateAll(){

renderCalendar();

updateDashboard();

showBookings();

showCustomers();

showExpenses();

showReports();

showUpcoming();

}


function formatDate(date){

if(!date)return "";

return new Date(date+"T00:00:00")
.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


function escapeHTML(str){

return String(str || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


updateAll();

</script>

</body>
</html>
